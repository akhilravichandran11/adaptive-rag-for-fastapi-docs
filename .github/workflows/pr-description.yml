name: Auto-fill PR description

# Runs scripts/ci/generate_pr_description.py when a PR is opened without a
# body, using the OpenAI API directly (no Warp/Oz dependency). Never
# overwrites a description someone already wrote. Reuses the criteria in
# .agents/skills/pr-description/SKILL.md so the generated title/body follow
# the same Conventional Commits + Summary/Changes/Testing structure as an
# interactive draft from an agent.
#
# Also runs on "edited"/"reopened" (e.g. GitHub auto-populated the body from
# a commit message at open-time, then someone cleared it) and can be run
# manually via workflow_dispatch to (re)generate a specific PR's description.
#
# Required repo secret:
#   OPENAI_API_KEY - stored under Settings > Secrets and variables > Actions

on:
  pull_request:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to (re)generate a description for"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  fill-description:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          if [ -n "$INPUT_PR_NUMBER" ]; then
            number="$INPUT_PR_NUMBER"
            body="$(gh pr view "$number" --repo "$REPO" --json body --jq .body)"
            base_ref="$(gh pr view "$number" --repo "$REPO" --json baseRefName --jq .baseRefName)"
          else
            number="$EVENT_PR_NUMBER"
            body="$EVENT_PR_BODY"
            base_ref="$EVENT_BASE_REF"
          fi
          {
            echo "number=$number"
            echo "base_ref=$base_ref"
          } >> "$GITHUB_OUTPUT"
          {
            echo "body<<PR_BODY_EOF"
            echo "$body"
            echo "PR_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check out PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet openai

      - name: Generate PR description if missing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          GITHUB_BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: python scripts/ci/generate_pr_description.py
