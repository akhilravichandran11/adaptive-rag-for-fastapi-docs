name: Auto-fill or suggest PR description

# Runs scripts/ci/generate_pr_description.py using the OpenAI API directly.
# Fills the title/body when the description is empty; otherwise publishes
# suggestions in one PR comment and the Actions summary without replacing
# the existing title/body. Reuses the criteria in
# .agents/skills/pr-description/SKILL.md so the generated title/body follow
# the same Conventional Commits + Summary/Changes/Testing structure as an
# interactive draft from an agent.
#
# Also runs on "edited"/"reopened" (e.g. GitHub auto-populated the body from
# a commit message at open-time, then someone cleared it) and can be run
# manually via workflow_dispatch to fill or suggest text for a specific PR.
# The workflow, script, and skill come from the default branch. PR commits
# are fetched only for reading their log/diff, never checked out or executed.
# Automatic fork PRs are skipped; manual runs must select the default branch.
#
# Required repo secret:
#   OPENAI_API_KEY - stored under Settings > Secrets and variables > Actions

on:
  pull_request_target:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to fill or suggest a title and description for"
        required: true

concurrency:
  group: pr-description-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  fill-description:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          number="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
          if [[ ! "$number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::PR number must be a positive integer"
            exit 1
          fi
          if [ -n "$INPUT_PR_NUMBER" ]; then
            body="$(gh pr view "$number" --repo "$REPO" --json body --jq .body)"
            base_ref="$(gh pr view "$number" --repo "$REPO" --json baseRefName --jq .baseRefName)"
          else
            body="$EVENT_PR_BODY"
            base_ref="$EVENT_BASE_REF"
          fi
          {
            echo "number=$number"
            echo "base_ref=$base_ref"
          } >> "$GITHUB_OUTPUT"
          delimiter="PR_BODY_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "body<<$delimiter"
            echo "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Check out trusted automation
        uses: actions/checkout@v4
        with:
          # Both allowed events identify a default-branch commit with github.sha.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet openai

      - name: Generate PR title and description
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          GITHUB_BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: python scripts/ci/generate_pr_description.py
