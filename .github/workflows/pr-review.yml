name: Custom PR code review

# Runs scripts/ci/review_pr.py for non-draft pull requests on the events
# listed below, using the OpenAI API directly (no Warp/Oz dependency).
# The script skips review when OPENAI_API_KEY is unavailable, including
# public fork pull requests. It reuses the review criteria in
# .agents/skills/bug-review/SKILL.md so the automated CI review follows
# the same severity-ranked output contract as an interactive review.
#
# Required repo secret:
#   OPENAI_API_KEY - stored under Settings > Secrets and variables > Actions

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet openai==2.53.0

      - name: Run code review
        id: code_review
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: python scripts/ci/review_pr.py

      - name: Report review failure
        if: steps.code_review.outcome == 'failure'
        run: |
          echo "::warning::Automated code review failed. See the review step logs; this is advisory."
          echo "### Automated code review failed" >> "$GITHUB_STEP_SUMMARY"
          echo "No completed review was posted. See the review step logs. This failure is advisory." >> "$GITHUB_STEP_SUMMARY"
