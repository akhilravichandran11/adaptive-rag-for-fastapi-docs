[project]
name = "adaptive-rag-for-fastapi-docs"
version = "0.0.1"
description = "Adaptive and Corrective RAG System for Q & A for FastApi Documentation"
requires-python = ">=3.11"
dependencies = [
    # Core Haystack
    "haystack-ai>=3.2.0",
    # Haystack Integrations
    "qdrant-haystack>=9.2.0",
    "google-genai-haystack>=2.1.1",
    # LLM Providers
    "google-genai>=1.31.0",
    "openai>=1.99.9",
    # Utilities
    "python-dotenv>=1.1.1",
    "tqdm>=4.67.1",
    "pydantic>=2.11.7",
    "nltk>=3.9.2",
    "huggingface-hub>=1.16.1",
    "tokenizers>=0.22.2",
    "tiktoken==0.13.0",
    "qdrant-client>=1.19.0",
    "voyage-embedders-haystack>=1.8.0",
    "ragas>=0.4.3",
    "langchain-core>=1.5.3",
    "langchain-community==0.4.1",  # 0.4.2 removed chat_models.vertexai, which ragas 0.4.3 imports
    "rapidfuzz>=3.14.3",  # ragas 0.4.3's default test-set transforms import it but do not declare it
    # Backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gitingest>=0.3.1",
    "tavily-python>=0.7.22",
    "tenacity>=9.1.4",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "upstash-redis>=1.9.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx2>=2.10.0",  # Starlette's TestClient uses it; without it, it falls back to httpx and warns
    "mdit-plain>=1.0.1",  # a loading test runs MarkdownToDocument, which needs it, to show what it drops
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_ingestion", "retrieval", "evaluation", "crag", "data_curation", "observability"]

[tool.ruff]
line-length = 100
target-version = "py311"     # your floor (requires-python = ">=3.11")

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import order)
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "BLE",  # flake8-blind-except   ← makes BLE001 active
    "SIM",  # flake8-simplify
]

ignore = ["E501"]

[tool.pytest.ini_options]
# Only tests/ holds this project's tests. data/ (the raw corpus) and .scratch/ (staged
# corpus copies) both contain FastAPI's own test_main.py files.
testpaths = ["tests"]
# Also skip them when pytest is given a path such as `.`. Setting norecursedirs replaces
# pytest's defaults, so they are repeated here before "data".
norecursedirs = [
    # pytest's defaults (".*" also keeps out .scratch/, .venv/ and .git/)
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    # this project: the raw corpus. Matches any folder named data at any depth, so a
    # folder of tests under tests/ must not use that name.
    "data",
]
